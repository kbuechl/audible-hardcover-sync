# docker-compose.yml
services:
  sync-tool:
    image: ghcr.io/kbuechl/audible-hardcover-sync:latest
    # Remove `build` to always use the published image; with it, `docker
    # compose up --build` builds from this checkout instead.
    build: .
    restart: unless-stopped
    environment:
      HARDCOVER_API_TOKEN: ${HARDCOVER_API_TOKEN}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-6h}
      PUBLIC_URL: ${PUBLIC_URL}
      NOTIFY_URLS: ${NOTIFY_URLS:-}
      MATCH_CONFIDENCE: ${MATCH_CONFIDENCE:-strict}
      WEB_UI_PORT: 8080
      STATE_DB_PATH: /data/state.db
      CREDENTIALS_PATH: /data/credentials.json
    volumes:
      - sync-data:/data
    ports:
      # Bind to localhost only for now — this UI has no authentication.
      # When ready to reach this from other devices on your LAN, replace
      # 127.0.0.1 with your host's actual LAN IP (never 0.0.0.0 / all
      # interfaces unless this host is genuinely unreachable from the
      # internet).
      - "127.0.0.1:8080:8080"

volumes:
  sync-data:
