<!-- internal/webui/templates/unmatched_list.html -->
<!doctype html>
<html>
<head><title>Unmatched Books</title></head>
<body>
<h1>Unmatched Books</h1>
{{if not .Items}}
<p>Nothing to resolve right now.</p>
{{else}}
<ul>
{{range .Items}}
  <li>
    <a href="/unmatched/{{.ASIN}}">{{if .Title}}{{.Title}}{{if .Author}} by {{.Author}}{{end}}{{else}}{{.ASIN}}{{end}}</a>
    — ASIN: {{.ASIN}}, status: {{.Status}}
  </li>
{{end}}
</ul>
{{end}}
</body>
</html>
