# Weekly dependency updates, grouped so each ecosystem opens at most one
# PR for minor/patch bumps. Majors still get their own PR.
#
# cooldown: a release must be at least 7 days old before Dependabot offers
# it, so a hijacked or broken release is usually caught and pulled first.
# Security updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /internal/webui/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      web-ui:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
